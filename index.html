<!DOCTYPE html>
<html>
  <head>
    <title>Comet Miner</title>

    <style>
      body {
        overflow: hidden;
        background-color: rgb(0, 0, 0);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
      }

      .game-screen {
        background-color: rgb(0, 5, 30);
        background-size: 60rem 40rem;
        height: 35rem;
        width: 60rem;
        position: relative;
        z-index: -1;
      }
      
      #player {
        position: absolute;
        z-index: 1;
      }

      #player img {
        height: 5rem;
        width: 5rem;
      }

      #comet {
        position: absolute;
        left: 30rem;
        top: 15rem;
        z-index: 0;
      }

      #comet img {
        height: 5rem;
        width: 5rem; 
      }
    </style>
  </head>
  <body>
    <div class="game-screen">
      <div id="player">
        <img src="https://jok3rgit.github.io/Comet-Miner/images/playership1.png" />
      </div>

      <div id="objects">
        <div id="comet">
          <img src="https://jok3rgit.github.io/Comet-Miner/images/comet.png" />
        </div>
      </div>
    </div>
      
    <script>
      //player frames
      function changeFrame() {
        let playerImg = document.querySelector("#player img");
        let playerSrc = playerImg.src;

        if (playerSrc === "https://jok3rgit.github.io/Comet-Miner/images/playership1.png") {
          playerImg.src = "https://jok3rgit.github.io/Comet-Miner/images/playership2.png";
        } else if (playerSrc === "https://jok3rgit.github.io/Comet-Miner/images/playership2.png") {
          playerImg.src = "https://jok3rgit.github.io/Comet-Miner/images/playership1.png";
        }
      }

      setInterval(() => {
        changeFrame();
      }, 500)
      
      //hitbox check
      function checkCollision(elA, elB) {
        const rA = elA.getBoundingClientRect();
        const rB = elB.getBoundingClientRect();

        return (
          rA.left < rB.right &&
          rA.right > rB.left &&
          rA.top < rB.bottom &&
          rA.bottom > rB.top
        );
      }

      const box1 = document.getElementById("player");
      const objects = document.getElementById("objects");

      // Only set up collision checking if objects element exists
      if (objects) {
        const box2 = objects.children;

        setInterval(() => {
          for (let obj of box2) {
            if (checkCollision(box1, obj)) {
              alert(obj.name);
              obj.style.display = "none";
            }
          }
        }, 100);
      }

      //player moves
      const player = document.getElementById("player");

      let x = 17.5;
      let y = 30;
      let isMoving = false;
      let moveInterval = null;

      window.addEventListener("keydown", (event) => {
        if (isMoving) return; // Prevent multiple movements

        const maxX = 55; // 60 - 5 (player width)
        const maxY = 30; // 35 - 5 (player height)
        const minX = 0;
        const minY = 0;

        const movePlayer = (targetX, targetY) => {
          isMoving = true;
          clearInterval(moveInterval);

          moveInterval = setInterval(() => {
            if (targetX !== null) {
              if (x < targetX) x = Math.min(x + 0.5, targetX);
              else if (x > targetX) x = Math.max(x - 0.5, targetX);
            }

            if (targetY !== null) {
              if (y < targetY) y = Math.min(y + 0.5, targetY);
              else if (y > targetY) y = Math.max(y - 0.5, targetY);
            }

            player.style.left = x + "rem";
            player.style.top = y + "rem";

            if (x === targetX && y === targetY) {
              clearInterval(moveInterval);
              isMoving = false;
            }
          }, 50);
        };

        if (event.key === "w" && y > minY) {
          let targetY = Math.max(y - 5, minY);
          movePlayer(null, targetY);
        }

        if (event.key === "s" && y < maxY) {
          let targetY = Math.min(y + 5, maxY);
          movePlayer(null, targetY);
        }

        if (event.key === "d" && x < maxX) {
          let targetX = Math.min(x + 5, maxX);
          movePlayer(targetX, null);
        }

        if (event.key === "a" && x > minX) {
          let targetX = Math.max(x - 5, minX);
          movePlayer(targetX, null);
        }
      });
      
    </script>
  </body>
</html>
